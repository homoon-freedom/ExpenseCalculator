<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 정산 & 송금 계산기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

    <!-- 상단 헤더 -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold flex items-center gap-1.5">
                    <span>₩</span> 여행 정산 & 송금 계산기
                </h1>
                <p class="text-xs text-emerald-200">개인별·부부별 맞춤형 지출 정산 시스템</p>
            </div>
            <button onclick="closeApp()" class="text-white hover:text-emerald-200 text-xl font-bold">&times;</button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-4 space-y-4">

        <!-- 여행 장소 / 제목 섹션 -->
        <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">여행 장소 / 제목</label>
            </div>
            <div class="flex gap-2">
                <input type="text" id="tripTitle" placeholder="예: 오키나와 우정 여행" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <button onclick="saveTrip()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1">💾 저장</button>
                <button onclick="shareTrip()" class="bg-teal-500 hover:bg-teal-600 text-white px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1">💬 공유</button>
            </div>
        </section>

        <!-- 참여자 관리 섹션 -->
        <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">참여자 관리</label>
                <span id="participantCount" class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-0.5 rounded-full">0명</span>
            </div>
            <div class="flex gap-2 mb-3">
                <input type="text" id="newParticipantName" placeholder="이름 (예: 찬팅)" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" onkeypress="if(event.key==='Enter') addParticipant()">
                <button onclick="addParticipant()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">참여자 추가</button>
            </div>
            <!-- 참여자 칩 목록 -->
            <div id="participantChips" class="flex flex-wrap gap-1.5">
                <!-- 동적 생성 -->
            </div>
        </section>

        <!-- 정산 방식 선택 및 부부 묶기 섹션 -->
        <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">정산 방식 선택</label>
                <div class="inline-flex rounded-lg bg-slate-100 p-0.5">
                    <button id="modeIndividual" onclick="setCalcMode('individual')" class="px-3 py-1 text-xs font-medium rounded-md transition bg-white text-slate-800 shadow-sm">개인별</button>
                    <button id="modeCouple" onclick="setCalcMode('couple')" class="px-3 py-1 text-xs font-medium rounded-md transition text-slate-600">부부별</button>
                </div>
            </div>

            <!-- 부부 묶기 및 대표자 지정 패널 -->
            <div id="couplePanel" class="hidden border border-emerald-200 bg-emerald-50/50 rounded-xl p-3 space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-emerald-800 flex items-center gap-1">🌺 부부 묶기 및 대표자 지정</span>
                    <span class="text-[10px] text-slate-500">👑 클릭 시 대표 변경</span>
                </div>
                <div id="coupleGroupList" class="space-y-2">
                    <!-- 동적 생성 -->
                </div>
            </div>
        </section>

        <!-- 지출 입력 섹션 -->
        <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-3">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">지출 입력</label>
            
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[11px] text-slate-600 font-medium block mb-1">지출 항목</label>
                    <select id="expenseCategory" onchange="onCategoryChange()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                        <option value="숙소">숙소</option>
                        <option value="렌트">렌트</option>
                        <option value="식사">식사</option>
                        <option value="직접입력">직접입력</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] text-slate-600 font-medium block mb-1">결제자</label>
                    <select id="expensePayer" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                        <!-- 동적 생성 -->
                    </select>
                </div>
            </div>

            <!-- 동적 항목 상세 입력 영역 (숙소/렌트 vs 식사/직접입력) -->
            <div id="dynamicDetailInputs" class="space-y-2 bg-slate-50 p-3 rounded-lg border border-slate-200">
                <!-- 동적으로 채워짐 -->
            </div>

            <div>
                <label class="text-[11px] text-slate-600 font-medium block mb-1">금액 (원)</label>
                <input type="number" id="expenseAmount" placeholder="0" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 font-bold">
            </div>

            <!-- 지출 참여 인원 체크 영역 -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-[11px] text-slate-600 font-medium">지출 참여 인원 (체크된 대상 N분할)</label>
                    <span class="text-[10px] text-emerald-700 font-medium">숙소/렌트는 이용 일수(박수) 선택 가능</span>
                </div>
                <div id="expenseParticipantCheckboxes" class="space-y-2 bg-slate-50 p-2.5 rounded-lg border border-slate-200 max-h-48 overflow-y-auto">
                    <!-- 동적 생성 -->
                </div>
            </div>

            <button onclick="addExpense()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">지출 내역 추가</button>
        </section>

        <!-- 지출 내역 목록 -->
        <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">지출 내역 목록</label>
                <span id="totalExpenseSummary" class="text-xs font-bold text-emerald-800">총 지출: 0원</span>
            </div>
            <div id="expenseListContainer" class="space-y-2 max-h-60 overflow-y-auto">
                <div class="text-center py-6 text-slate-400 text-xs">등록된 지출 내역이 없습니다.</div>
            </div>
        </section>

        <!-- 정산하기 버튼 -->
        <button onclick="calculateSettlement()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
            <span>📊</span> 정산하기 (자동 계산)
        </button>

        <!-- 여행 정산 및 송금 요약 섹션 -->
        <section id="settlementResultSection" class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <div>
                    <h2 class="text-sm font-bold text-slate-800">여행 정산 및 송금 요약</h2>
                    <p class="text-[11px] text-slate-500">지출 내역 및 정산 결과 (100원 단위 올림 적용)</p>
                </div>
                <span id="resultModeBadge" class="bg-emerald-100 text-emerald-800 text-[11px] font-bold px-2 py-1 rounded-md">개인별 정산</span>
            </div>

            <!-- 전체 지출 내역 요약 박스 -->
            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex justify-between items-center">
                <span class="text-xs font-semibold text-slate-700">전체 지출 내역</span>
                <span id="summaryTotalAmount" class="text-xs font-bold text-emerald-800">총 지출: 0원</span>
            </div>

            <!-- 대상별(개인별 또는 부부별) 정산 카드 리스트 -->
            <div id="settlementCardsContainer" class="space-y-3">
                <div class="text-center py-6 text-slate-400 text-xs">정산하기 버튼을 누르면 결과가 표시됩니다.</div>
            </div>
        </section>

    </main>

    <script>
        // 전역 상태 데이터
        let state = {
            title: "",
            participants: [], // [{ name: '찬팅' }, ...]
            calcMode: "individual", // 'individual' or 'couple'
            couples: [              // 부부 그룹 리스트
                { id: 1, name: "부부1", representative: "찬팅", members: ["찬팅", "찬다"] },
                { id: 2, name: "부부2", representative: "미르", members: ["미르", "나나"] },
                { id: 3, name: "부부3", representative: "마카엘", members: ["마카엘", "별"] }
            ],
            expenses: [],           // 지출 내역 리스트
            remittances: {}         // 송금 완료 상태 체크 저장소 { "보내는사람_받는사람": true/false }
        };

        // 앱 초기화 실행
        window.onload = function() {
            // 초기 샘플 데이터 로드 (스크린샷 참조)
            state.participants = ["찬팅", "찬다", "미르", "나나", "마카엘", "별"];
            renderAll();
            onCategoryChange();
        };

        function closeApp() {
            if(confirm("정산기를 닫으시겠습니까?")) {
                window.close();
            }
        }

        function saveTrip() {
            state.title = document.getElementById('tripTitle').value;
            alert(`"${state.title || '여행'}" 정보가 저장되었습니다.`);
        }

        function shareTrip() {
            const title = document.getElementById('tripTitle').value || '여행 정산';
            if (navigator.clipboard) {
                navigator.clipboard.writeText(window.location.href);
                alert(`[${title}] 정산 링크가 클립보드에 복사되었습니다!`);
            } else {
                alert("공유 링크 복사 완료!");
            }
        }

        // 탭 전환 (개인별 / 부부별)
        function setCalcMode(mode) {
            state.calcMode = mode;
            const btnIndi = document.getElementById('modeIndividual');
            const btnCouple = document.getElementById('modeCouple');
            const couplePanel = document.getElementById('couplePanel');

            if(mode === 'individual') {
                btnIndi.className = "px-3 py-1 text-xs font-medium rounded-md transition bg-white text-slate-800 shadow-sm";
                btnCouple.className = "px-3 py-1 text-xs font-medium rounded-md transition text-slate-600";
                couplePanel.classList.add('hidden');
            } else {
                btnCouple.className = "px-3 py-1 text-xs font-medium rounded-md transition bg-white text-slate-800 shadow-sm";
                btnIndi.className = "px-3 py-1 text-xs font-medium rounded-md transition text-slate-600";
                couplePanel.classList.remove('hidden');
            }
            renderExpenseParticipants();
            calculateSettlement();
        }

        // 참여자 추가
        function addParticipant() {
            const input = document.getElementById('newParticipantName');
            const name = input.value.trim();
            if(!name) return;
            if(state.participants.includes(name)) {
                alert("이미 존재하는 참여자입니다.");
                return;
            }
            state.participants.push(name);
            input.value = '';
            renderAll();
        }

        // 참여자 삭제
        function removeParticipant(name) {
            state.participants = state.participants.filter(p => p !== name);
            // 부부 그룹에서도 제거
            state.couples.forEach(c => {
                c.members = c.members.filter(m => m !== name);
                if(c.representative === name && c.members.length > 0) {
                    c.representative = c.members[0];
                }
            });
            renderAll();
        }

        // 대표자 변경
        function changeRepresentative(coupleId, memberName) {
            const couple = state.couples.find(c => c.id === coupleId);
            if(couple) {
                couple.representative = memberName;
                renderAll();
                calculateSettlement();
            }
        }

        // 부부 그룹 해제
        function removeCoupleGroup(coupleId) {
            state.couples = state.couples.filter(c => c.id !== coupleId);
            renderAll();
            calculateSettlement();
        }

        // 화면 전체 렌더링 갱신
        function renderAll() {
            // 참여자 수 표시
            document.getElementById('participantCount').innerText = `${state.participants.length}명`;

            // 참여자 칩 렌더링
            const chipContainer = document.getElementById('participantChips');
            chipContainer.innerHTML = state.participants.map(p => `
                <span class="inline-flex items-center gap-1 bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-full border border-slate-200">
                    ${p}
                    <button onclick="removeParticipant('${p}')" class="text-slate-400 hover:text-red-600 font-bold">&times;</button>
                </span>
            `).join('');

            // 결제자 셀렉트 박스 렌더링
            const payerSelect = document.getElementById('expensePayer');
            const currentPayer = payerSelect.value;
            payerSelect.innerHTML = state.participants.map(p => `<option value="${p}">${p}</option>`).join('');
            if(state.participants.includes(currentPayer)) payerSelect.value = currentPayer;

            // 부부 그룹 리스트 렌더링
            const coupleListContainer = document.getElementById('coupleGroupList');
            coupleListContainer.innerHTML = state.couples.map(c => `
                <div class="flex items-center justify-between bg-white p-2 rounded-lg border border-emerald-100 text-xs">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="font-bold text-emerald-700">${c.name}</span>
                        ${c.members.map(m => `
                            <button onclick="changeRepresentative(${c.id}, '${m}')" class="px-2 py-0.5 rounded border transition ${m === c.representative ? 'bg-amber-100 border-amber-300 text-amber-800 font-bold' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}">
                                ${m === c.representative ? '👑 ' : ''}${m}
                            </button>
                        `).join(' & ')}
                    </div>
                    <button onclick="removeCoupleGroup(${c.id})" class="text-slate-400 hover:text-red-500 font-medium px-1">해제</button>
                </div>
            `).join('');

            renderExpenseParticipants();
        }

        // 지출 항목 변경 시 입력폼 형태 변경 (숙소/렌트 vs 식사/직접입력)
        function onCategoryChange() {
            const category = document.getElementById('expenseCategory').value;
            const detailContainer = document.getElementById('dynamicDetailInputs');

            if (category === '숙소' || category === '렌트') {
                detailContainer.innerHTML = `
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[11px] text-slate-600 font-medium block mb-1">시작일</label>
                            <input type="date" id="startDate" class="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs bg-white">
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-600 font-medium block mb-1">마치는 날</label>
                            <input type="date" id="endDate" class="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs bg-white" onchange="calcNights()">
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-[11px] text-emerald-700 font-semibold pt-1">
                        <span id="calculatedNightsText">이용 일수(박수): 자동 계산</span>
                        <input type="hidden" id="calculatedNightsVal" value="1">
                    </div>
                `;
                // 오늘 날짜 기본 세팅
                const today = new Date().toISOString().split('T')[0];
                const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
                document.getElementById('startDate').value = today;
                document.getElementById('endDate').value = tomorrow;
                calcNights();
            } else {
                detailContainer.innerHTML = `
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[11px] text-slate-600 font-medium block mb-1">날짜</label>
                            <input type="date" id="expenseDate" class="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs bg-white">
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-600 font-medium block mb-1">세부 항목명</label>
                            <input type="text" id="expenseDetailName" placeholder="예: 삼겹살, 택시비" class="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs bg-white">
                        </div>
                    </div>
                `;
                document.getElementById('expenseDate').value = new Date().toISOString().split('T')[0];
            }
            renderExpenseParticipants();
        }

        // 숙소/렌트 이용 일수(박수) 계산 (5일이면 4박 5일이므로 실제 이용일수는 4일 계산)
        function calcNights() {
            const startInput = document.getElementById('startDate');
            const endInput = document.getElementById('endDate');
            const nightsText = document.getElementById('calculatedNightsText');
            const nightsVal = document.getElementById('calculatedNightsVal');

            if(startInput && endInput && startInput.value && endInput.value) {
                const start = new Date(startInput.value);
                const end = new Date(endInput.value);
                const diffTime = end - start;
                const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                
                let actualNights = diffDays > 0 ? diffDays : 1;
                nightsText.innerText = `총 ${diffDays >= 0 ? diffDays + 1 : 1}일 일정 (숙박/렌트 이용 일수: ${actualNights}일 적용)`;
                if(nightsVal) nightsVal.value = actualNights;
                renderExpenseParticipants();
            }
        }

        // 지출 참여 인원 체크박스 렌더링 (숙소/렌트의 경우 개인/부부별 일수 선택 셀렉트 포함)
        function renderExpenseParticipants() {
            const container = document.getElementById('expenseParticipantCheckboxes');
            const category = document.getElementById('expenseCategory') ? document.getElementById('expenseCategory').value : '숙소';
            const isAccommodationOrRent = (category === '숙소' || category === '렌트');
            const maxDays = isAccommodationOrRent ? (parseInt(document.getElementById('calculatedNightsVal')?.value) || 1) : 1;

            if(state.participants.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-400 text-center py-2">먼저 참여자를 추가해주세요.</div>`;
                return;
            }

            if(state.calcMode === 'individual') {
                container.innerHTML = state.participants.map(p => `
                    <div class="flex items-center justify-between bg-white px-3 py-1.5 rounded border border-slate-200 text-xs">
                        <label class="flex items-center gap-2 cursor-pointer font-medium text-slate-700">
                            <input type="checkbox" name="expPart" value="${p}" checked class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
                            <span>${p}</span>
                        </label>
                        ${isAccommodationOrRent ? `
                            <div class="flex items-center gap-1">
                                <span class="text-[11px] text-slate-500">이용일수:</span>
                                <select id="days_${p}" class="border border-slate-300 rounded px-1.5 py-0.5 text-xs bg-white font-medium text-emerald-700">
                                    ${Array.from({length: maxDays}, (_, i) => `<option value="${i+1}" ${i+1 === maxDays ? 'selected' : ''}>${i+1}일</option>`).join('')}
                                </select>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } else {
                // 부부별 모드일 때 대표자 기준으로 체크박스 표시
                container.innerHTML = state.couples.map(c => `
                    <div class="flex items-center justify-between bg-white px-3 py-1.5 rounded border border-emerald-100 text-xs">
                        <label class="flex items-center gap-2 cursor-pointer font-medium text-slate-700">
                            <input type="checkbox" name="expPart" value="${c.representative}" checked class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
                            <span class="text-emerald-800 font-bold">🌺 ${c.name} (${c.members.join('&')})</span>
                            <span class="text-[10px] text-slate-400">대표: ${c.representative}</span>
                        </label>
                        ${isAccommodationOrRent ? `
                            <div class="flex items-center gap-1">
                                <span class="text-[11px] text-slate-500">이용일수:</span>
                                <select id="days_${c.representative}" class="border border-slate-300 rounded px-1.5 py-0.5 text-xs bg-white font-medium text-emerald-700">
                                    ${Array.from({length: maxDays}, (_, i) => `<option value="${i+1}" ${i+1 === maxDays ? 'selected' : ''}>${i+1}일</option>`).join('')}
                                </select>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }
        }

        // 지출 내역 추가
        function addExpense() {
            const category = document.getElementById('expenseCategory').value;
            const payer = document.getElementById('expensePayer').value;
            const amount = parseFloat(document.getElementById('expenseAmount').value);

            if(!amount || amount <= 0) {
                alert("올바른 금액을 입력해주세요.");
                return;
            }

            const checkboxes = document.querySelectorAll('input[name="expPart"]:checked');
            if(checkboxes.length === 0) {
                alert("지출에 참여하는 인원을 1명 이상 체크해주세요.");
                return;
            }

            let detailInfo = {};
            if(category === '숙소' || category === '렌트') {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                const maxDays = parseInt(document.getElementById('calculatedNightsVal').value) || 1;
                
                let participantDays = {};
                checkboxes.forEach(cb => {
                    const name = cb.value;
                    const selectElem = document.getElementById(`days_${name}`);
                    participantDays[name] = selectElem ? parseInt(selectElem.value) : maxDays;
                });

                detailInfo = {
                    category,
                    startDate,
                    endDate,
                    maxDays,
                    participantDays
                };
            } else {
                const date = document.getElementById('expenseDate').value;
                const detailName = document.getElementById('expenseDetailName').value || category;
                detailInfo = {
                    category,
                    date,
                    detailName,
                    participants: Array.from(checkboxes).map(cb => cb.value)
                };
            }

            const newExpense = {
                id: Date.now(),
                category,
                payer,
                amount,
                detail: detailInfo
            };

            state.expenses.push(newExpense);
            document.getElementById('expenseAmount').value = '';
            renderExpenseList();
            calculateSettlement();
        }

        // 지출 내역 삭제
        function removeExpense(id) {
            state.expenses = state.expenses.filter(e => e.id !== id);
            renderExpenseList();
            calculateSettlement();
        }

        // 지출 내역 목록 렌더링
        function renderExpenseList() {
            const container = document.getElementById('expenseListContainer');
            const totalSummary = document.getElementById('totalExpenseSummary');
            const summaryTotalAmount = document.getElementById('summaryTotalAmount');

            let totalSum = state.expenses.reduce((acc, cur) => acc + cur.amount, 0);
            totalSummary.innerText = `총 지출: ${totalSum.toLocaleString()}원`;
            summaryTotalAmount.innerText = `총 지출: ${totalSum.toLocaleString()}원`;

            if(state.expenses.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">등록된 지출 내역이 없습니다.</div>`;
                return;
            }

            container.innerHTML = state.expenses.map(e => {
                let subDesc = '';
                if(e.detail.category === '숙소' || e.detail.category === '렌트') {
                    subDesc = `${e.detail.startDate} ~ ${e.detail.endDate} (${e.detail.maxDays}일 기준)`;
                } else {
                    subDesc = `${e.detail.date} | ${e.detail.detailName}`;
                }

                return `
                    <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-xs">
                        <div class="space-y-0.5">
                            <div class="flex items-center gap-1.5">
                                <span class="font-bold bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded text-[10px]">${e.category}</span>
                                <span class="font-semibold text-slate-800">${e.amount.toLocaleString()}원</span>
                                <span class="text-slate-500 font-medium">(결제: ${e.payer})</span>
                            </div>
                            <div class="text-[11px] text-slate-500">${subDesc}</div>
                        </div>
                        <button onclick="removeExpense(${e.id})" class="text-slate-400 hover:text-red-600 font-bold px-2 py-1 text-sm">&times;</button>
                    </div>
                `;
            }).join('');
        }

        // 송금 완료 체크 상태 토글
        function toggleRemittanceCheck(key) {
            state.remittances[key] = !state.remittances[key];
            calculateSettlement();
        }

        // 100원 단위 올림 함수
        function ceilTo100(val) {
            return Math.ceil(val / 100) * 100;
        }

        // 정산 및 송금 계산 실행 로직
        function calculateSettlement() {
            const container = document.getElementById('settlementCardsContainer');
            const resultModeBadge = document.getElementById('resultModeBadge');
            
            resultModeBadge.innerText = state.calcMode === 'individual' ? '개인별 정산' : '부부별 정산';

            if(state.expenses.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">등록된 지출 내역이 없습니다.</div>`;
                return;
            }

            // 단위 관리 맵핑 준비
            let targets = [];
            if(state.calcMode === 'individual') {
                targets = [...state.participants];
            } else {
                // 부부별 모드인 경우 대표자 이름을 키로 사용
                targets = state.couples.map(c => c.representative);
                // 부부 그룹에 속하지 않은 독립 참여자가 있다면 추가
                state.participants.forEach(p => {
                    let inCouple = state.couples.some(c => c.members.includes(p));
                    if(!inCouple && !targets.includes(p)) targets.push(p);
                });
            }

            // 결제 총액 및 부담(사용) 금액 집계
            let paidMap = {};      // 결제 금액
            let consumedMap = {};  // 부담할 금액 (올림 적용 전후 계산용)
            targets.forEach(t => {
                paidMap[t] = 0;
                consumedMap[t] = 0;
            });

            state.expenses.forEach(e => {
                // 결제자 집계 (부부별 모드일 때는 결제자가 속한 부부 대표에게 합산)
                let actualPayer = e.payer;
                if(state.calcMode === 'couple') {
                    for(let c of state.couples) {
                        if(c.members.includes(e.payer)) {
                            actualPayer = c.representative;
                            break;
                        }
                    }
                }
                if(paidMap[actualPayer] !== undefined) {
                    paidMap[actualPayer] += e.amount;
                } else {
                    paidMap[actualPayer] = e.amount;
                }

                // 부담 금액 안분 계산
                if(e.detail.category === '숙소' || e.detail.category === '렌트') {
                    let pDays = e.detail.participantDays; // { 이름: 일수 }
                    
                    // 만약 부부별 모드라면 참여 인원을 대표자 기준으로 합산
                    let adjustedPDays = {};
                    for(let [person, days] of Object.entries(pDays)) {
                        let targetKey = person;
                        if(state.calcMode === 'couple') {
                            for(let c of state.couples) {
                                if(c.members.includes(person)) {
                                    targetKey = c.representative;
                                    break;
                                }
                            }
                        }
                        // 동일 대상이 중복되면 최대 일수 또는 합산 (일별 정산이므로 해당일수 적용)
                        adjustedPDays[targetKey] = Math.max(adjustedPDays[targetKey] || 0, days);
                    }

                    // 가중치(일수) 총합 계산
                    let totalWeight = Object.values(adjustedPDays).reduce((a, b) => a + b, 0);
                    if(totalWeight > 0) {
                        for(let [targetKey, days] of Object.entries(adjustedPDays)) {
                            if(consumedMap[targetKey] !== undefined) {
                                consumedMap[targetKey] += e.amount * (days / totalWeight);
                            }
                        }
                    }
                } else {
                    // 일반 식사 / 직접입력 (N분의 1 1/N)
                    let rawParts = e.detail.participants;
                    let targetParts = new Set();
                    rawParts.forEach(p => {
                        let targetKey = p;
                        if(state.calcMode === 'couple') {
                            for(let c of state.couples) {
                                if(c.members.includes(p)) {
                                    targetKey = c.representative;
                                    break;
                                }
                            }
                        }
                        targetParts.add(targetKey);
                    });

                    let count = targetParts.size;
                    if(count > 0) {
                        let share = e.amount / count;
                        targetParts.forEach(t => {
                            if(consumedMap[t] !== undefined) {
                                consumedMap[t] += share;
                            }
                        });
                    }
                }
            });

            // 각 대상별 순수 잔액 계산 (결제금액 - 부담금액)
            // 100원 단위 올림 적용 산출
            let netBalances = {};
            targets.forEach(t => {
                let paid = paidMap[t] || 0;
                let consumed = consumedMap[t] || 0;
                // 100원 단위 아래 올림 적용된 부담금 계산
                netBalances[t] = {
                    paid,
                    consumed: consumed,
                    ceilConsumed: ceilTo100(consumed),
                    net: paid - ceilTo100(consumed) // 양수면 받을 돈, 음수면 보낼 돈
                };
            });

            // 송금 관계(누가 누구에게 얼마를 보내야 하는지) 알고리즘 계산
            let debtors = []; // 보낼 사람 (net < 0)
            let creditors = []; // 받을 사람 (net > 0)

            targets.forEach(t => {
                let balance = netBalances[t].net;
                if(balance < 0) {
                    debtors.push({ name: t, amount: -balance });
                } else if(balance > 0) {
                    creditors.push({ name: t, amount: balance });
                }
            });

            // 송금 트랜잭션 매칭 생성
            let transfers = [];
            let dIdx = 0, cIdx = 0;
            while(dIdx < debtors.length && cIdx < creditors.length) {
                let debtor = debtors[dIdx];
                let creditor = creditors[cIdx];
                let transferAmount = Math.min(debtor.amount, creditor.amount);

                if(transferAmount > 0) {
                    transfers.push({
                        from: debtor.name,
                        to: creditor.name,
                        amount: transferAmount
                    });
                }

                debtor.amount -= transferAmount;
                creditor.amount -= transferAmount;

                if(debtor.amount <= 0) dIdx++;
                if(creditor.amount <= 0) cIdx++;
            }

            // 결과 카드 렌더링
            container.innerHTML = targets.map(t => {
                let data = netBalances[t];
                let cardTitle = t;
                let subTitleText = state.calcMode === 'couple' ? getCoupleSubtext(t) : '개인 정산';

                // 이 사람이 보내야 할 송금 내역 필터링
                let myTransfers = transfers.filter(tr => tr.from === t);
                
                let transferHtml = '';
                if(myTransfers.length > 0) {
                    transferHtml = myTransfers.map(tr => {
                        let remittanceKey = `${tr.from}_${tr.to}`;
                        let isChecked = state.remittances[remittanceKey] || false;
                        let effectiveAmount = isChecked ? 0 : tr.amount;

                        return `
                            <div class="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                                <span class="text-slate-600">송금할 대상: <strong class="text-emerald-700">${tr.to}</strong>에게 <strong>${tr.amount.toLocaleString()}원</strong></span>
                                <label class="flex items-center gap-1.5 cursor-pointer bg-slate-50 px-2 py-1 rounded border border-slate-200">
                                    <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="toggleRemittanceCheck('${remittanceKey}')" class="w-3.5 h-3.5 text-emerald-600 rounded">
                                    <span class="text-[11px] font-medium text-slate-700">송금 완료 체크</span>
                                </label>
                            </div>
                        `;
                    }).join('');
                } else {
                    transferHtml = `
                        <div class="mt-2 pt-2 border-t border-slate-100 text-[11px] text-slate-400 text-center">
                            부부 대표가 송금할 금액: 0원 (보낼 금액 없음)
                        </div>
                    `;
                }

                return `
                    <div class="bg-slate-50 rounded-xl p-3.5 border border-slate-200 space-y-2">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-1.5">
                                <span class="text-sm font-bold text-slate-900">👑 ${cardTitle}</span>
                                <span class="text-[11px] text-slate-500">${subTitleText}</span>
                            </div>
                            <span class="bg-slate-200 text-slate-700 text-[11px] font-bold px-2 py-0.5 rounded-full">정산 완료 (${data.ceilConsumed.toLocaleString()}원)</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs py-1">
                            <div class="text-slate-600">부부 결제 금액: <strong class="text-slate-900 font-bold">${data.paid.toLocaleString()}원</strong></div>
                            <div class="text-slate-600">부부 부담할 몫 (사용 금액): <strong class="text-slate-900 font-bold">${data.ceilConsumed.toLocaleString()}원</strong></div>
                        </div>
                        <div class="text-[10px] text-slate-400">
                            (상세 부담 원금: ${Math.round(data.consumed).toLocaleString()}원 + 100원 단위 올림 적용)
                        </div>
                        ${transferHtml}
                    </div>
                `;
            }).join('');
        }

        // 부부 모드일 때 대표자 밑에 부부원 이름 표시 보조 함수
        function getCoupleSubtext(repName) {
            let couple = state.couples.find(c => c.representative === repName);
            if(couple) {
                return `${couple.name} (${couple.members.join(' & ')}) 대표`;
            }
            return '개인 참여자';
        }
    </script>
</body>
</html>
