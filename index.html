<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>여행 정산 & 송금 계산기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-16 text-slate-800">

    <!-- 상단 헤더 -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="min-w-0 pr-2">
                <h1 id="headerTripTitle" class="text-base sm:text-lg font-bold truncate">
                    여행 정산 & 송금 계산기
                </h1>
                <p class="text-xs text-emerald-200">개인별·부부별 맞춤형 지출 정산 시스템</p>
            </div>
            <button onclick="closeApp()" class="text-white hover:text-emerald-200 text-2xl font-bold px-2 shrink-0">&times;</button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-5 space-y-5">

        <!-- 여행 장소 / 제목 섹션 -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-2">
            <label class="text-sm font-bold text-slate-600 block">여행 장소 / 제목</label>
            <div class="flex items-center gap-2">
                <input type="text" id="tripTitle" oninput="updateHeaderTitle()" placeholder="예: 오키나와 우정 여행" class="flex-1 min-w-0 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div class="flex items-center gap-1.5 shrink-0">
                    <button onclick="saveTrip()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3.5 py-2.5 rounded-xl text-sm font-semibold transition shadow-sm">💾 저장</button>
                    <button onclick="shareTrip()" class="bg-teal-500 hover:bg-teal-600 text-white px-3.5 py-2.5 rounded-xl text-sm font-semibold transition shadow-sm">💬 공유</button>
                </div>
            </div>
        </section>

        <!-- 참여자 관리 섹션 -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center">
                <label class="text-sm font-bold text-slate-600">참여자 관리</label>
                <span id="participantCount" class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">0명</span>
            </div>
            <div class="flex items-center gap-2">
                <input type="text" id="newParticipantName" placeholder="이름 (예: 찬팅)" class="flex-1 min-w-0 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500" onkeypress="if(event.key==='Enter') addParticipant()">
                <button onclick="addParticipant()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shrink-0 shadow-sm">참여자 추가</button>
            </div>
            <div id="participantChips" class="flex flex-wrap gap-2 pt-1">
                <!-- 동적 생성 -->
            </div>
        </section>

        <!-- 정산 방식 선택 및 부부 묶기 섹션 -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center">
                <label class="text-sm font-bold text-slate-600">정산 방식 선택</label>
                <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200">
                    <button id="modeIndividual" onclick="setCalcMode('individual')" class="px-4 py-1.5 text-sm font-semibold rounded-lg transition bg-white text-slate-800 shadow-sm">개인별</button>
                    <button id="modeCouple" onclick="setCalcMode('couple')" class="px-4 py-1.5 text-sm font-semibold rounded-lg transition text-slate-600">부부별</button>
                </div>
            </div>

            <div id="couplePanel" class="hidden border border-emerald-200 bg-emerald-50/50 rounded-xl p-3.5 space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-emerald-800 flex items-center gap-1">🌺 부부 묶기 및 대표자 지정</span>
                    <span class="text-[11px] text-slate-500">👑 클릭 시 대표 변경</span>
                </div>
                <div id="coupleGroupList" class="space-y-2">
                    <!-- 동적 생성 -->
                </div>
            </div>
        </section>

        <!-- 지출 입력 섹션 -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
            <label class="text-sm font-bold text-slate-600 block">지출 입력</label>
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-slate-600 font-semibold block mb-1">지출 항목</label>
                    <select id="expenseCategory" onchange="onCategoryChange()" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white font-medium">
                        <option value="숙소">숙소</option>
                        <option value="렌트">렌트</option>
                        <option value="식사">식사</option>
                        <option value="직접입력">직접입력</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-slate-600 font-semibold block mb-1">결제자</label>
                    <select id="expensePayer" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white font-medium">
                        <!-- 동적 생성 -->
                    </select>
                </div>
            </div>

            <!-- 동적 항목 상세 입력 영역 -->
            <div id="dynamicDetailInputs" class="space-y-2.5 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                <!-- 동적으로 채워짐 -->
            </div>

            <div>
                <label class="text-xs text-slate-600 font-semibold block mb-1">금액 (원)</label>
                <input type="number" id="expenseAmount" placeholder="0" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 font-bold">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="text-xs text-slate-600 font-semibold">지출 참여 인원 (불참자 체크 해제 가능)</label>
                    <span class="text-[11px] text-emerald-700 font-semibold">숙소/렌트는 일수 선택</span>
                </div>
                <div id="expenseParticipantCheckboxes" class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <!-- 동적 생성 -->
                </div>
            </div>

            <button onclick="addExpense()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-3 rounded-xl text-base transition shadow-sm">지출 내역 추가</button>
        </section>

        <!-- 지출 내역 목록 -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center">
                <label class="text-sm font-bold text-slate-600">지출 내역 목록</label>
                <span id="totalExpenseSummary" class="text-sm font-extrabold text-emerald-800">총 지출: 0원</span>
            </div>
            <div id="expenseListContainer" class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                <div class="text-center py-6 text-slate-400 text-sm">등록된 지출 내역이 없습니다.</div>
            </div>
        </section>

        <!-- 정산하기 버튼 -->
        <button onclick="calculateSettlement()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3.5 rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-base">
            <span>📊</span> 정산하기 (자동 계산)
        </button>

        <!-- 여행 정산 및 송금 요약 섹션 -->
        <section id="settlementResultSection" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <div>
                    <h2 class="text-base font-bold text-slate-800">여행 정산 및 송금 요약</h2>
                    <p class="text-xs text-slate-500">항목별 세부 송금 및 총 송금액 결과</p>
                </div>
                <span id="resultModeBadge" class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-lg">개인별 정산</span>
            </div>

            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 flex justify-between items-center">
                <span class="text-xs font-bold text-slate-700">전체 지출 내역</span>
                <span id="summaryTotalAmount" class="text-sm font-bold text-emerald-800">총 지출: 0원</span>
            </div>

            <div id="settlementCardsContainer" class="space-y-3.5">
                <div class="text-center py-6 text-slate-400 text-sm">정산하기 버튼을 누르면 결과가 표시됩니다.</div>
            </div>
        </section>

    </main>

    <script>
        let state = {
            title: "",
            participants: [],
            calcMode: "individual",
            couples: [
                { id: 1, name: "부부1", representative: "찬팅", members: ["찬팅", "찬다"] },
                { id: 2, name: "부부2", representative: "미르", members: ["미르", "나나"] },
                { id: 3, name: "부부3", representative: "마카엘", members: ["마카엘", "별"] }
            ],
            expenses: [],
            remittances: {}
        };

        window.onload = function() {
            state.participants = ["찬팅", "찬다", "미르", "나나", "마카엘", "별"];
            renderAll();
            onCategoryChange();
        };

        function closeApp() {
            if(confirm("정산기를 닫으시겠습니까?")) {
                window.close();
            }
        }

        function updateHeaderTitle() {
            const titleInput = document.getElementById('tripTitle').value.trim();
            const headerTitle = document.getElementById('headerTripTitle');
            if (titleInput) {
                headerTitle.innerText = `${titleInput} - 여행 정산 & 송금 계산기`;
            } else {
                headerTitle.innerText = "여행 정산 & 송금 계산기";
            }
        }

        function saveTrip() {
            state.title = document.getElementById('tripTitle').value;
            alert(`"${state.title || '여행'}" 정보가 저장되었습니다.`);
        }

        function shareTrip() {
            const title = document.getElementById('tripTitle').value || '여행 정산';
            if (navigator.clipboard) {
                navigator.clipboard.writeText(window.location.href);
                alert(`[${title}] 정산 링크가 클립보드에 복사되었습니다!`);
            } else {
                alert("공유 링크 복사 완료!");
            }
        }

        function setCalcMode(mode) {
            state.calcMode = mode;
            const btnIndi = document.getElementById('modeIndividual');
            const btnCouple = document.getElementById('modeCouple');
            const couplePanel = document.getElementById('couplePanel');

            if(mode === 'individual') {
                btnIndi.className = "px-4 py-1.5 text-sm font-semibold rounded-lg transition bg-white text-slate-800 shadow-sm";
                btnCouple.className = "px-4 py-1.5 text-sm font-semibold rounded-lg transition text-slate-600";
                couplePanel.classList.add('hidden');
            } else {
                btnCouple.className = "px-4 py-1.5 text-sm font-semibold rounded-lg transition bg-white text-slate-800 shadow-sm";
                btnIndi.className = "px-4 py-1.5 text-sm font-semibold rounded-lg transition text-slate-600";
                couplePanel.classList.remove('hidden');
            }
            renderExpenseParticipants();
            calculateSettlement();
        }

        function addParticipant() {
            const input = document.getElementById('newParticipantName');
            const name = input.value.trim();
            if(!name) return;
            if(state.participants.includes(name)) {
                alert("이미 존재하는 참여자입니다.");
                return;
            }
            state.participants.push(name);
            input.value = '';
            renderAll();
        }

        function removeParticipant(name) {
            state.participants = state.participants.filter(p => p !== name);
            state.couples.forEach(c => {
                c.members = c.members.filter(m => m !== name);
                if(c.representative === name && c.members.length > 0) {
                    c.representative = c.members[0];
                }
            });
            renderAll();
        }

        function changeRepresentative(coupleId, memberName) {
            const couple = state.couples.find(c => c.id === coupleId);
            if(couple) {
                couple.representative = memberName;
                renderAll();
                calculateSettlement();
            }
        }

        function removeCoupleGroup(coupleId) {
            state.couples = state.couples.filter(c => c.id !== coupleId);
            renderAll();
            calculateSettlement();
        }

        function renderAll() {
            document.getElementById('participantCount').innerText = `${state.participants.length}명`;

            const chipContainer = document.getElementById('participantChips');
            chipContainer.innerHTML = state.participants.map(p => `
                <span class="inline-flex items-center gap-1.5 bg-slate-100 text-slate-700 text-xs sm:text-sm px-3 py-1.5 rounded-xl border border-slate-200 font-medium">
                    ${p}
                    <button onclick="removeParticipant('${p}')" class="text-slate-400 hover:text-red-600 font-bold">&times;</button>
                </span>
            `).join('');

            const payerSelect = document.getElementById('expensePayer');
            const currentPayer = payerSelect.value;
            payerSelect.innerHTML = state.participants.map(p => `<option value="${p}">${p}</option>`).join('');
            if(state.participants.includes(currentPayer)) payerSelect.value = currentPayer;

            const coupleListContainer = document.getElementById('coupleGroupList');
            coupleListContainer.innerHTML = state.couples.map(c => `
                <div class="flex items-center justify-between bg-white p-2.5 rounded-xl border border-emerald-100 text-xs sm:text-sm">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="font-bold text-emerald-700">${c.name}</span>
                        ${c.members.map(m => `
                            <button onclick="changeRepresentative(${c.id}, '${m}')" class="px-2.5 py-1 rounded-lg border transition ${m === c.representative ? 'bg-amber-100 border-amber-300 text-amber-900 font-bold' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}">
                                ${m === c.representative ? '👑 ' : ''}${m}
                            </button>
                        `).join(' & ')}
                    </div>
                    <button onclick="removeCoupleGroup(${c.id})" class="text-slate-400 hover:text-red-500 font-medium px-1.5">해제</button>
                </div>
            `).join('');

            renderExpenseParticipants();
        }

        function onCategoryChange() {
            const category = document.getElementById('expenseCategory').value;
            const detailContainer = document.getElementById('dynamicDetailInputs');

            if (category === '숙소' || category === '렌트') {
                detailContainer.innerHTML = `
                    <div class="grid grid-cols-2 gap-1.5 w-full">
                        <div class="min-w-0">
                            <label class="text-xs text-slate-600 font-semibold block mb-1">시작일</label>
                            <input type="date" id="startDate" onchange="calcNights()" oninput="calcNights()" class="w-full min-w-0 border border-slate-300 rounded-xl px-1.5 py-2 text-[11px] sm:text-xs bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 box-border">
                        </div>
                        <div class="min-w-0">
                            <label class="text-xs text-slate-600 font-semibold block mb-1">마치는 날</label>
                            <input type="date" id="endDate" onchange="calcNights()" oninput="calcNights()" class="w-full min-w-0 border border-slate-300 rounded-xl px-1.5 py-2 text-[11px] sm:text-xs bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 box-border">
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-xs text-emerald-700 font-bold pt-1">
                        <span id="calculatedNightsText">총 5일 일정 (이용 일수: 4일 적용)</span>
                        <input type="hidden" id="calculatedNightsVal" value="4">
                    </div>
                `;
                const today = new Date();
                const futureDate = new Date(today.getTime() + 4 * 86400000);
                document.getElementById('startDate').value = today.toISOString().split('T')[0];
                document.getElementById('endDate').value = futureDate.toISOString().split('T')[0];
                calcNights();
            } else {
                detailContainer.innerHTML = `
                    <div class="grid grid-cols-2 gap-2 w-full">
                        <div class="min-w-0">
                            <label class="text-xs text-slate-600 font-semibold block mb-1">날짜</label>
                            <input type="date" id="expenseDate" class="w-full min-w-0 border border-slate-300 rounded-xl px-1.5 py-2 text-[11px] sm:text-xs bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 box-border">
                        </div>
                        <div class="min-w-0">
                            <label class="text-xs text-slate-600 font-semibold block mb-1">세부 항목명</label>
                            <input type="text" id="expenseDetailName" placeholder="예: 삼겹살, 택시비" class="w-full min-w-0 border border-slate-300 rounded-xl px-2 py-2 text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 box-border">
                        </div>
                    </div>
                `;
                document.getElementById('expenseDate').value = new Date().toISOString().split('T')[0];
            }
            renderExpenseParticipants();
        }

        function calcNights() {
            const startInput = document.getElementById('startDate');
            const endInput = document.getElementById('endDate');
            const nightsText = document.getElementById('calculatedNightsText');
            const nightsVal = document.getElementById('calculatedNightsVal');

            if(startInput && endInput && startInput.value && endInput.value) {
                const start = new Date(startInput.value);
                const end = new Date(endInput.value);
                const diffTime = end - start;
                const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                
                let actualNights = diffDays > 0 ? diffDays : 4;
                if(nightsText) nightsText.innerText = `총 ${diffDays >= 0 ? diffDays + 1 : 5}일 일정 (이용 일수: ${actualNights}일 적용)`;
                if(nightsVal) nightsVal.value = actualNights;
                renderExpenseParticipants();
            }
        }

        function renderExpenseParticipants() {
            const container = document.getElementById('expenseParticipantCheckboxes');
            const category = document.getElementById('expenseCategory') ? document.getElementById('expenseCategory').value : '숙소';
            const isAccommodationOrRent = (category === '숙소' || category === '렌트');
            const maxDays = isAccommodationOrRent ? (parseInt(document.getElementById('calculatedNightsVal')?.value) || 4) : 1;

            if(!container) return;

            if(state.participants.length === 0) {
                container.innerHTML = `<div class="text-xs sm:text-sm text-slate-400 text-center py-2">먼저 참여자를 추가해주세요.</div>`;
                return;
            }

            container.innerHTML = state.participants.map(p => {
                const selectId = `days_${p}`;
                const existingSelect = document.getElementById(selectId);
                const prevVal = existingSelect ? parseInt(existingSelect.value) : maxDays;
                const selectedVal = prevVal > maxDays ? maxDays : prevVal;

                let coupleInfo = "";
                if(state.calcMode === 'couple') {
                    for(let c of state.couples) {
                        if(c.members.includes(p)) {
                            coupleInfo = ` <span class="text-[11px] text-emerald-600 font-bold">(${c.name}${p === c.representative ? ', 대표' : ''})</span>`;
                            break;
                        }
                    }
                }

                return `
                    <div class="flex items-center justify-between bg-white px-3.5 py-2.5 rounded-xl border border-slate-100 text-xs sm:text-sm">
                        <label class="flex items-center gap-2.5 cursor-pointer font-semibold text-slate-700 min-w-0 truncate">
                            <input type="checkbox" name="expPart" value="${p}" checked class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 shrink-0">
                            <span class="truncate">${p}${coupleInfo}</span>
                        </label>
                        ${isAccommodationOrRent ? `
                            <div class="flex items-center gap-1.5 shrink-0 ml-2">
                                <span class="text-xs text-slate-500">이용일수:</span>
                                <select id="${selectId}" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs sm:text-sm bg-white font-bold text-emerald-700 focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                    ${Array.from({length: maxDays}, (_, i) => `<option value="${i+1}" ${i+1 === selectedVal ? 'selected' : ''}>${i+1}일</option>`).join('')}
                                </select>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function addExpense() {
            const category = document.getElementById('expenseCategory').value;
            const payer = document.getElementById('expensePayer').value;
            const amount = parseFloat(document.getElementById('expenseAmount').value);

            if(!amount || amount <= 0) {
                alert("올바른 금액을 입력해주세요.");
                return;
            }

            const checkboxes = document.querySelectorAll('input[name="expPart"]:checked');
            if(checkboxes.length === 0) {
                alert("지출에 참여하는 인원을 1명 이상 체크해주세요.");
                return;
            }

            let detailInfo = {};
            if(category === '숙소' || category === '렌트') {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                const maxDays = parseInt(document.getElementById('calculatedNightsVal').value) || 4;
                
                let participantDays = {};
                checkboxes.forEach(cb => {
                    const name = cb.value;
                    const selectElem = document.getElementById(`days_${name}`);
                    participantDays[name] = selectElem ? parseInt(selectElem.value) : maxDays;
                });

                detailInfo = {
                    category,
                    startDate,
                    endDate,
                    maxDays,
                    participantDays,
                    titleName: `${category} (${startDate}~${endDate})`
                };
            } else {
                const date = document.getElementById('expenseDate').value;
                const detailName = document.getElementById('expenseDetailName').value || category;
                detailInfo = {
                    category,
                    date,
                    detailName,
                    participants: Array.from(checkboxes).map(cb => cb.value),
                    titleName: `${detailName} (${date})`
                };
            }

            const newExpense = {
                id: Date.now(),
                category,
                payer,
                amount,
                detail: detailInfo
            };

            state.expenses.push(newExpense);
            document.getElementById('expenseAmount').value = '';
            renderExpenseList();
            calculateSettlement();
        }

        function removeExpense(id) {
            state.expenses = state.expenses.filter(e => e.id !== id);
            renderExpenseList();
            calculateSettlement();
        }

        function renderExpenseList() {
            const container = document.getElementById('expenseListContainer');
            const totalSummary = document.getElementById('totalExpenseSummary');
            const summaryTotalAmount = document.getElementById('summaryTotalAmount');

            let totalSum = state.expenses.reduce((acc, cur) => acc + cur.amount, 0);
            totalSummary.innerText = `총 지출: ${totalSum.toLocaleString()}원`;
            summaryTotalAmount.innerText = `총 지출: ${totalSum.toLocaleString()}원`;

            if(state.expenses.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">등록된 지출 내역이 없습니다.</div>`;
                return;
            }

            container.innerHTML = state.expenses.map(e => {
                let subDesc = e.detail.titleName;

                return `
                    <div class="flex items-center justify-between bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-xs sm:text-sm">
                        <div class="space-y-1 min-w-0 pr-2">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md text-xs shrink-0">${e.category}</span>
                                <span class="font-bold text-slate-900">${e.amount.toLocaleString()}원</span>
                                <span class="text-slate-500 font-medium">(결제: ${e.payer})</span>
                            </div>
                            <div class="text-xs text-slate-500 truncate">${subDesc}</div>
                        </div>
                        <button onclick="removeExpense(${e.id})" class="text-slate-400 hover:text-red-600 font-bold px-2.5 py-1 text-lg shrink-0">&times;</button>
                    </div>
                `;
            }).join('');
        }

        function toggleRemittanceCheck(key) {
            state.remittances[key] = !state.remittances[key];
            calculateSettlement();
        }

        function ceilTo1000(val) {
            return Math.ceil(val / 1000) * 1000;
        }

        function getTargetRepresentative(personName) {
            if(state.calcMode === 'individual') return personName;
            for(let c of state.couples) {
                if(c.members.includes(personName)) {
                    return c.representative;
                }
            }
            return personName;
        }

        function calculateSettlement() {
            const container = document.getElementById('settlementCardsContainer');
            const resultModeBadge = document.getElementById('resultModeBadge');
            
            resultModeBadge.innerText = state.calcMode === 'individual' ? '개인별 정산' : '부부별 정산';

            if(state.expenses.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">정산하기 버튼을 누르면 결과가 표시됩니다.</div>`;
                return;
            }

            let targets = [];
            if(state.calcMode === 'individual') {
                targets = [...state.participants];
            } else {
                targets = state.couples.map(c => c.representative);
                state.participants.forEach(p => {
                    let inCouple = state.couples.some(c => c.members.includes(p));
                    if(!inCouple && !targets.includes(p)) targets.push(p);
                });
            }

            let paidMap = {};      
            let consumedMap = {};  
            targets.forEach(t => {
                paidMap[t] = 0;
                consumedMap[t] = 0;
            });

            let itemizedTransfers = [];

            state.expenses.forEach(e => {
                let actualPayer = getTargetRepresentative(e.payer);
                if(paidMap[actualPayer] !== undefined) {
                    paidMap[actualPayer] += e.amount;
                } else {
                    paidMap[actualPayer] = e.amount;
                }

                let itemConsumed = {};
                targets.forEach(t => itemConsumed[t] = 0);

                if(e.detail.category === '숙소' || e.detail.category === '렌트') {
                    let pDays = e.detail.participantDays; 
                    let adjustedPDays = {};
                    for(let [person, days] of Object.entries(pDays)) {
                        let targetKey = getTargetRepresentative(person);
                        adjustedPDays[targetKey] = (adjustedPDays[targetKey] || 0) + days;
                    }

                    let totalWeight = Object.values(adjustedPDays).reduce((a, b) => a + b, 0);
                    if(totalWeight > 0) {
                        for(let [targetKey, days] of Object.entries(adjustedPDays)) {
                            let share = e.amount * (days / totalWeight);
                            itemConsumed[targetKey] = (itemConsumed[targetKey] || 0) + share;
                            consumedMap[targetKey] += share;
                        }
                    }
                } else {
                    let rawParts = e.detail.participants; 
                    
                    // 부부 모드일 때 참여 인원수(체크된 인원)에 비례하여 가중치 계산 (1명 참여 vs 2명 모두 참여 구분)
                    let targetWeights = {};
                    targets.forEach(t => targetWeights[t] = 0);

                    rawParts.forEach(p => {
                        let targetKey = getTargetRepresentative(p);
                        targetWeights[targetKey] = (targetWeights[targetKey] || 0) + 1;
                    });

                    let totalWeight = Object.values(targetWeights).reduce((a, b) => a + b, 0);
                    if(totalWeight > 0) {
                        targets.forEach(t => {
                            let weight = targetWeights[t] || 0;
                            if(weight > 0) {
                                let share = e.amount * (weight / totalWeight);
                                itemConsumed[t] = (itemConsumed[t] || 0) + share;
                                consumedMap[t] += share;
                            }
                        });
                    }
                }

                let itemNet = {};
                targets.forEach(t => {
                    let p = (actualPayer === t) ? e.amount : 0;
                    let c = itemConsumed[t] || 0;
                    itemNet[t] = p - c;
                });

                let itemDebtors = [];
                let itemCreditors = [];
                targets.forEach(t => {
                    let bal = itemNet[t];
                    if(bal < 0) itemDebtors.push({ name: t, amount: -bal });
                    else if(bal > 0) itemCreditors.push({ name: t, amount: bal });
                });

                let idIdx = 0, icIdx = 0;
                while(idIdx < itemDebtors.length && icIdx < itemCreditors.length) {
                    let deb = itemDebtors[idIdx];
                    let cred = itemCreditors[icIdx];
                    let amt = Math.min(deb.amount, cred.amount);

                    if(amt > 0) {
                        let ceilAmt = ceilTo1000(amt);
                        itemizedTransfers.push({
                            from: deb.name,
                            to: cred.name,
                            amount: ceilAmt,
                            expenseTitle: e.detail.titleName,
                            category: e.category
                        });
                    }

                    deb.amount -= amt;
                    cred.amount -= amt;
                    if(deb.amount <= 0) idIdx++;
                    if(cred.amount <= 0) icIdx++;
                }
            });

            let netBalances = {};
            targets.forEach(t => {
                let paid = paidMap[t] || 0;
                let consumed = consumedMap[t] || 0;
                let ceilConsumed = ceilTo1000(consumed);
                netBalances[t] = {
                    paid,
                    consumed: consumed,
                    ceilConsumed: ceilConsumed,
                    net: paid - ceilConsumed 
                };
            });

            container.innerHTML = targets.map(t => {
                let data = netBalances[t];
                let cardTitle = t;
                let subTitleText = state.calcMode === 'couple' ? getCoupleSubtext(t) : '개인 정산';

                let myItemTransfers = itemizedTransfers.filter(tr => tr.from === t);
                
                let totalSendAmount = 0;
                let transferHtml = '';
                if(myItemTransfers.length > 0) {
                    transferHtml = myItemTransfers.map((tr, idx) => {
                        let remittanceKey = `${tr.from}_${tr.to}_${tr.expenseTitle}_${idx}`;
                        let isChecked = state.remittances[remittanceKey] || false;
                        
                        if(!isChecked) {
                            totalSendAmount += tr.amount;
                        }

                        return `
                            <div class="mt-2.5 pt-2.5 border-t border-slate-100 flex items-center justify-between text-xs sm:text-sm gap-2">
                                <div class="min-w-0 pr-1">
                                    <div class="text-slate-500 text-xs truncate">📌 [${tr.category}] ${tr.expenseTitle}</div>
                                    <div class="text-slate-700 font-medium truncate">👉 <strong class="text-emerald-700">${tr.to}</strong>에게 <strong class="shrink-0">${isChecked ? '0원 (완료)' : tr.amount.toLocaleString() + '원'}</strong></div>
                                </div>
                                <label class="flex items-center gap-1.5 cursor-pointer bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200 shrink-0 font-medium text-xs">
                                    <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="toggleRemittanceCheck('${remittanceKey}')" class="w-4 h-4 text-emerald-600 rounded">
                                    <span class="text-slate-700">송금완료</span>
                                </label>
                            </div>
                        `;
                    }).join('');
                } else {
                    transferHtml = `
                        <div class="mt-2.5 pt-2.5 border-t border-slate-100 text-xs text-slate-400 text-center">
                            보낼 송금액 없음 (0원)
                        </div>
                    `;
                }

                return `
                    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200 space-y-3">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2 min-w-0">
                                <span class="text-base font-bold text-slate-900 truncate">👑 ${cardTitle}</span>
                                <span class="text-xs text-slate-500 shrink-0 font-medium">${subTitleText}</span>
                            </div>
                            <span class="bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-1 rounded-full shrink-0">정산완료 (${data.ceilConsumed.toLocaleString()}원)</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs sm:text-sm py-1">
                            <div class="text-slate-600">결제금액: <strong class="text-slate-900 font-bold">${data.paid.toLocaleString()}원</strong></div>
                            <div class="text-slate-600">부담할몫: <strong class="text-slate-900 font-bold">${data.ceilConsumed.toLocaleString()}원</strong></div>
                        </div>
                        <div class="text-[11px] text-slate-400">
                            (원금: ${Math.round(data.consumed).toLocaleString()}원 + 1,000원 단위 이하 올림)
                        </div>
                        <div class="space-y-1.5 pt-1">
                            <div class="text-xs font-bold text-slate-600">항목별 송금 대상 리스트:</div>
                            ${transferHtml}
                        </div>
                        <div class="mt-3.5 pt-3 border-t-2 border-emerald-500 bg-emerald-50/70 p-3 rounded-xl flex justify-between items-center text-sm">
                            <span class="font-bold text-emerald-900">💸 송금할 총금액:</span>
                            <span class="font-extrabold text-emerald-700 text-base">${totalSendAmount.toLocaleString()}원</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getCoupleSubtext(repName) {
            let couple = state.couples.find(c => c.representative === repName);
            if(couple) {
                return `${couple.name} (${couple.members.join(' & ')}) 대표`;
            }
            return '개인 참여자';
        }
    </script>
</body>
</html>
